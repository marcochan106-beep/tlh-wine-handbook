rname{font-weight:800}.progrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.points{margin:0;padding-left:20px}.note{font-size:12px;color:var(--muted)}@media(max-width:820px){.app{display:block}.side{position:relative;height:auto}.main{padding:18px}.facts,.taste,.progrid{grid-template-columns:1fr}.wide{grid-column:auto}.hero h2{font-size:28px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Tin Lung Heen</div><h1>Wine By The Glass Handbook</h1><input id="q" class="search" placeholder="Search 22 wines"><div id="nav"></div></aside><main id="main" class="main"></main></div><script>const wines=[{"group":"Champagne & Sparkling","vintage":"NV","name":"Barons de Rothschild \"Ritz\" Brut Reserve","region":"Champagne, France","grape":"Chardonnay and Pinot Noir","style":"Non-vintage Brut Champagne","why":"A polished, Chardonnay-led house Champagne that combines immediate freshness with luxury recognition.","appearance":"Pale gold with a fine, persistent mousse.","aromas":"Citrus, green apple, pear, white flowers and light brioche.","palate":"Dry, bright and balanced, with fine bubbles and a clean finish.","guest":"Fresh and elegant, with orchard fruit, citrus and delicate toast.","story":"Created for The Ritz-Carlton relationship, this cuvee reflects the Barons de Rothschild preference for Chardonnay-led finesse and precise blending.","matters":"It gives the programme an accessible luxury Champagne with enough freshness for dim sum and enough brand presence for celebrations.","list":"It serves as the welcoming house-style Champagne: recognisable, versatile and easy to recommend across the opening part of a Cantonese meal.","guestprofile":"Guests seeking classic Champagne, an aperitif, a celebration bottle or a refined but uncomplicated luxury choice.","strategy":"Recommend at the start of the meal, especially with seafood dim sum and fried appetisers. Avoid presenting it as a powerful or heavily autolytic Champagne.","age":"Best enjoyed for freshness and balance; short additional ageing may increase toast and nut tones.","points":["Rothschild family Champagne","Chardonnay-led finesse","Versatile aperitif","Strong luxury-hotel relevance","Highly food-friendly"],"bestwith":"Classic seafood appetisers, steamed shellfish and delicate fried dim sum","bestdishes":["Deep-fried shrimp toast","Steamed shrimp dumpling with bamboo shoot","Steamed crab meat and shrimp dumpling topped with salmon roe"],"flagship":{"dish":"Steamed shrimp dumpling with bamboo shoot","why":"The cuvee’s citrus lift and fine mousse brighten the sweet shrimp and bamboo shoot without masking the translucent wrapper. Its restrained toast adds complexity while remaining lighter than richer vintage Champagne."},"whywins":"The house style is broad enough for mixed dim sum yet especially strong when clean shellfish sweetness and a light fried or steamed texture need refreshment."},{"group":"Champagne & Sparkling","vintage":"NV","name":"Ruinart Blanc de Blancs","region":"Champagne, France","grape":"100% Chardonnay","style":"Blanc de Blancs Brut Champagne","why":"A benchmark Chardonnay Champagne known for elegance, freshness and a rounded but precise texture.","appearance":"Brilliant pale yellow with green reflections and persistent fine bubbles.","aromas":"Ripe lemon, pear, peach, white flowers, ginger and subtle pastry.","palate":"Enveloping yet tense, with citrus freshness, fine mousse and a long finish.","guest":"Elegant and refreshing, with ripe citrus, pear, peach and floral spice.","story":"Maison Ruinart was founded in 1729 and is widely recognised as the first established Champagne house. Chardonnay remains the signature grape behind its refined house identity.","matters":"It is one of the world's most recognised Chardonnay-focused Champagnes and translates luxury into a style that remains genuinely useful at the table.","list":"Its acidity, lack of tannin, fine mousse and Chardonnay purity make it especially effective with shellfish, seafood and delicate Cantonese flavours.","guestprofile":"Champagne enthusiasts, white Burgundy drinkers, seafood-focused tables and guests preferring elegance over power.","strategy":"Recommend confidently with shellfish and refined dim sum. Serve in a tulip glass at about 8 to 10 C. Do not over-chill or describe it as austere.","age":"Excellent now; careful cellaring can shift fresh fruit toward brioche, hazelnut and honeyed complexity.","points":["Founded in 1729","100% Chardonnay","Benchmark Blanc de Blancs","Elegant rather than powerful","Exceptional seafood compatibility"],"bestwith":"Delicate premium shellfish, steamed crab and seafood dishes built on purity rather than sauce","bestdishes":["Steamed crab claw with egg white in Huadiao wine","Steamed crab meat and shrimp dumpling topped with salmon roe","Steamed shrimp dumpling with bamboo shoot"],"flagship":{"dish":"Steamed crab claw with egg white in Huadiao wine","why":"Chardonnay purity mirrors the sweetness of crab, while citrus acidity lifts the soft egg-white texture and Huadiao perfume. A broader, oakier white would blur the dish’s delicacy."},"whywins":"Ruinart wins when the dish is refined and saline: high acidity, no tannin and fine mousse preserve detail rather than adding weight."},{"group":"Champagne & Sparkling","vintage":"NV","name":"Devaux Collection D Rose Brut","region":"Champagne, France","grape":"Pinot Noir and Chardonnay","style":"Brut Rose Champagne","why":"A gastronomic rose Champagne offering red-fruit expression, freshness and greater vinous breadth.","appearance":"Pale salmon with lively, fine bubbles.","aromas":"Wild strawberry, redcurrant, citrus peel and light pastry.","palate":"Dry, lively and structured, with red-fruit persistence.","guest":"Fresh rose Champagne with red berries, citrus and subtle pastry.","story":"Devaux developed Collection D as a food-oriented range with extended maturation and a more serious, vinous profile.","matters":"It broadens the Champagne selection beyond white-fruit styles and gives staff a red-fruited sparkling option for richer dim sum.","list":"Its Pinot-led fruit works with sweet roasted flavours and fried textures while Champagne acidity keeps the pairing fresh.","guestprofile":"Rose Champagne drinkers, guests wanting something festive but food-focused, and tables ordering pork or richer dim sum.","strategy":"Recommend when a guest wants Champagne with more fruit and colour. Avoid describing it as sweet; the style is dry and gastronomic.","age":"Best while the red fruit remains vivid, though bottle age can add dried fruit, toast and spice.","points":["Food-focused rose Champagne","Red-fruit character","Dry and structured","Useful with pork and fried dim sum","Distinctive alternative to Blanc de Blancs"],"bestwith":"Roast poultry, glazed pork and savoury dishes with a red-fruit or sweet-sour element","bestdishes":["Roasted goose with plum sauce","Barbecued pork with osmanthus flower honey","Baked barbecued pork bun with almond flakes"],"flagship":{"dish":"Roasted goose with plum sauce","why":"Pinot-led red fruit meets the plum sauce directly, while Champagne acidity cuts through rendered goose fat. Blanc de Blancs is fresher but lacks the same flavour bridge to roast meat."},"whywins":"The rose style combines the palate-cleansing function of Champagne with enough red-fruit breadth for Cantonese barbecue."},{"group":"Champagne & Sparkling","vintage":"2017","name":"Dom Perignon Brut","region":"Champagne, France","grape":"Chardonnay and Pinot Noir","style":"Vintage Prestige Champagne","why":"A globally recognised prestige cuvee combining vintage character, depth and long maturation.","appearance":"Pale gold with very fine, persistent effervescence.","aromas":"Citrus, stone fruit, white flowers, toast, smoke and spice.","palate":"Layered, concentrated and energetic, with a long, composed finish.","guest":"Complex vintage Champagne with fruit, toast, spice and remarkable length.","story":"Dom Perignon is produced only as a vintage Champagne. Each release interprets a single growing season through the house pursuit of harmony and longevity.","matters":"It is one of the strongest global symbols of prestige Champagne and gives the programme a celebratory, age-worthy flagship.","list":"It answers requests for the most prestigious Champagne by the glass and has sufficient concentration for richer signature dishes.","guestprofile":"Celebration tables, luxury-focused guests, collectors and experienced Champagne drinkers.","strategy":"Lead with vintage prestige and depth. Serve around 10 C in a generous tulip glass. Recommend with richer shellfish rather than the most delicate dishes.","age":"Built for development; bottle age can increase toast, smoke, nut and savoury complexity.","points":["Vintage-only prestige Champagne","Global luxury recognition","Long maturation","Greater depth and structure","Strong celebration choice"],"bestwith":"Concentrated luxury seafood, crab roe, lobster broth and deeply savoury fried preparations","bestdishes":["Pan-fried lobster with tomato, served with lobster broth","Deep-fried crab shell stuffed with crab meat and onion","Steamed fish maw stuffed with conch in lobster sauce"],"flagship":{"dish":"Pan-fried lobster with tomato, served with lobster broth","why":"Vintage depth matches the lobster broth, while acidity handles both tomato and shellfish richness. Lighter Champagne can refresh the dish but may disappear beside the broth."},"whywins":"Long maturation and greater concentration let Dom Perignon behave as a table wine, not only an aperitif."},{"group":"Champagne & Sparkling","vintage":"2023","name":"Silver Heights Bloom Sparkling Wine Brut","region":"Ningxia, China","grape":"Chardonnay, Pinot Noir and rice wine","style":"Pét-nat inspired Chinese sparkling wine","why":"A distinctive Ningxia sparkling wine combining international grapes with a local rice-wine element.","appearance":"Pink-orange with vigorous, youthful bubbles.","aromas":"Honeydew, pear, blossom, cereal, spice and light earth.","palate":"Lively, fruit-driven and lightly savoury, with gentle sweetness balanced by sparkle.","guest":"An adventurous Chinese sparkling wine with pear, melon, flowers and a subtle grain note.","story":"Silver Heights is a family estate led by Emma Gao. Bloom reflects an experimental side of Ningxia through ambient fermentation and a blend that includes rice wine.","matters":"It shows that Chinese wine can be creative rather than imitative, giving staff a compelling local innovation story.","list":"It adds a Chinese sparkling option with enough fruit and texture for dim sum, while differentiating the programme from conventional Champagne lists.","guestprofile":"Curious guests, Chinese-wine supporters, natural-wine drinkers and tables seeking something unconventional.","strategy":"Explain the rice-wine component before pouring. Recommend for adventurous guests and aromatic or fried dim sum; avoid presenting it as a direct Champagne substitute.","age":"Designed primarily for youthful fruit, pétillance and energy rather than extended cellaring.","points":["Ningxia origin","Emma Gao and Silver Heights","Includes rice wine","Ambient-fermentation story","Distinctly Chinese sparkling identity"],"bestwith":"Creative fried seafood, savoury-sweet dim sum and dishes that welcome fruit, grain and gentle pétillance","bestdishes":["Deep-fried shrimp toast","Deep-fried crispy roll stuffed with crab meat and mayonnaise sauce","Deep-fried taro dumpling with scallop in coconut sauce"],"flagship":{"dish":"Deep-fried shrimp toast","why":"Pear and melon fruit echo shrimp sweetness, while the rice-wine component meets the toast’s cereal character. The lively bubbles keep the fried surface from becoming heavy."},"whywins":"Bloom is most distinctive where its fruit, grain note and informal pétillance can engage both seafood and frying."},{"group":"Champagne & Sparkling","vintage":"2018","name":"Wiston Estate Blanc de Noirs Brut","region":"West Sussex, England","grape":"Pinot Noir and Pinot Meunier","style":"Vintage English Blanc de Noirs sparkling wine","why":"A broad, vinous English sparkling wine combining dark-grape weight with cool-climate acidity.","appearance":"Pale gold with a persistent mousse.","aromas":"Apple, red fruit, citrus, toast and savoury spice.","palate":"Fuller-bodied and fruit-driven, with firm freshness and a gastronomic finish.","guest":"A broader sparkling wine with orchard fruit, subtle red fruit and toast.","story":"Wiston Estate is rooted in the South Downs of Sussex. Wiston Estate Cuvee 2016 was served for the toasts at the 2025 Windsor Castle state banquet hosted by King Charles III, a striking sign of English sparkling wine’s place in high-level British hospitality.","matters":"It demonstrates England's ability to produce age-worthy sparkling wine and offers a darker-fruited alternative to Chardonnay-led Champagne.","list":"Its broader texture supports richer dim sum and roasted flavours while retaining the acidity needed for Cantonese cuisine.","guestprofile":"English-wine explorers, Pinot-led Champagne drinkers and guests seeking a fuller sparkling style.","strategy":"Recommend with richer fried or pork dishes. Describe Blanc de Noirs clearly as white sparkling wine made from dark grapes.","age":"The 2018 vintage has development potential; ageing may add toast, nuts and savoury depth.","points":["Wiston poured at a 2025 Windsor Castle state banquet","Pinot Noir and Pinot Meunier","Traditional-method sparkling","Broader and more vinous","Strong gastronomic style"],"bestwith":"Roasted pork, richer fried dim sum and dishes needing sparkling freshness with Pinot weight","bestdishes":["Barbecued pork with osmanthus flower honey","Roasted crispy suckling pig served with Chinese puff","Deep-fried taro dumpling with scallop in coconut sauce"],"flagship":{"dish":"Barbecued pork with osmanthus flower honey","why":"Pinot-derived body stands up to pork and glaze, while English acidity resets the palate after fat and sweetness. A lighter Blanc de Blancs can feel too delicate here."},"whywins":"Wiston wins when sparkling wine needs vinous breadth as well as cleansing acidity."},{"group":"White","vintage":"2023","name":"Barmes-Buecher Rosenberg Gewurztraminer","region":"Alsace, France","grape":"Gewurztraminer","style":"Aromatic dry to gently off-dry white","why":"An intensely aromatic white with floral, lychee and spice character that expands the list beyond conventional crisp whites.","appearance":"Medium lemon-gold.","aromas":"Rose, lychee, peach, exotic fruit and warm spice.","palate":"Broad, perfumed and textural, with modest acidity and possible gentle sweetness.","guest":"Highly aromatic and floral, with lychee, peach and warm spice.","story":"Barmes-Buecher is a family Alsace estate known for biodynamic farming and expressive wines that emphasise variety and place.","matters":"Gewurztraminer is one of the clearest demonstrations that aroma and texture can be more important than acidity in white-wine style.","list":"It gives the team a strong option for aromatic, spicy and gently sweet Cantonese flavours that can overwhelm leaner whites.","guestprofile":"Guests who enjoy aromatic whites, lychee and floral flavours, or prefer softer acidity.","strategy":"Recommend with aromatic and mildly spicy dim sum. Avoid for guests explicitly requesting very crisp, mineral or bone-dry wine.","age":"Best for vivid perfume now; short ageing can add honey, dried fruit and spice.","points":["Alsace Gewurztraminer","Biodynamic estate identity","Rose and lychee perfume","Broad textured palate","Useful with aromatic cuisine"],"bestwith":"Aromatic, sweet-savoury and mildly spicy dishes featuring plum, coconut, X.O. sauce or fragrant marinades","bestdishes":["Wok-fried eel with plum sauce","Deep-fried taro dumpling with scallop in coconut sauce","Steamed garoupa dumpling with X.O. sauce"],"flagship":{"dish":"Wok-fried eel with plum sauce","why":"Rose, lychee and exotic fruit echo the plum glaze, while the wine’s broad texture matches eel. Lean Sauvignon Blanc would sharpen the dish but miss its perfume and sweetness."},"whywins":"Gewurztraminer wins through aromatic similarity and textural breadth, especially where a purely crisp white would seem severe."},{"group":"White","vintage":"2023","name":"Xige Jade Dove Sauvignon Blanc","region":"Ningxia, China","grape":"Sauvignon Blanc","style":"Dry aromatic white","why":"A modern Ningxia white showing that the region can deliver freshness and aromatic precision as well as powerful reds.","appearance":"Pale lemon.","aromas":"Citrus, peach, herbs and tropical fruit.","palate":"Dry, fresh and medium-bodied, with an aromatic finish.","guest":"Fresh Chinese Sauvignon Blanc with citrus, peach and subtle herbs.","story":"Founded in 2017 by Zhang Yanzhi, Xige Estate rapidly became a leading modern Ningxia producer. A Xige Cabernet Sauvignon and Cabernet Gernischt blend was selected when President Xi Jinping met French President Emmanuel Macron in China in April 2023.","matters":"It broadens the narrative of Chinese wine and offers an accessible route into Ningxia through a familiar international grape.","list":"It supports the restaurant's Chinese-wine identity while giving seafood and dim sum a fresh, aromatic pairing option.","guestprofile":"Sauvignon Blanc drinkers, guests exploring Chinese wine and tables ordering seafood-focused dim sum.","strategy":"Lead with Ningxia origin and freshness. Recommend for guests who enjoy Sauvignon Blanc; avoid overselling it as equivalent to Marlborough.","age":"Best enjoyed young for citrus, herbs and aromatic lift.","points":["Xige wine selected for the 2023 Xi-Macron meeting","Modern Chinese producer","Fresh aromatic style","Accessible Chinese-wine entry point","Good seafood compatibility"],"bestwith":"Light Chinese seafood, clean fish flavours and preparations where freshness matters more than oak or weight","bestdishes":["Sautéed garoupa fillet with conpoy","Steamed shrimp dumpling with bamboo shoot","Steamed fish maw stuffed with conch in lobster sauce"],"flagship":{"dish":"Sautéed garoupa fillet with conpoy","why":"Citrus and herbal freshness sharpen the garoupa, while moderate body accommodates the savoury conpoy. Oak-aged Chardonnay would add unnecessary weight."},"whywins":"This wine is strongest as a clean, modern Chinese counterpoint to delicate seafood and restrained umami."},{"group":"White","vintage":"2021","name":"Villa Maria Taylors Pass Sauvignon Blanc","region":"Awatere Valley, Marlborough, New Zealand","grape":"100% Sauvignon Blanc","style":"Single-vineyard dry white","why":"A focused Marlborough Sauvignon Blanc with herbal intensity, citrus precision and a saline finish.","appearance":"Pale lemon with green highlights.","aromas":"Blackcurrant, lime zest, sage, coriander and white peach.","palate":"Concentrated jalapeño and lemongrass notes with fresh acidity and salinity.","guest":"Focused Sauvignon Blanc with lime, herbs, white peach and a mouth-watering finish.","story":"Villa Maria was founded in 1961 and Taylors Pass represents its single-vineyard approach in the cooler Awatere Valley.","matters":"It shows the more serious, site-driven side of Marlborough Sauvignon Blanc beyond simple tropical fruit.","list":"Its herbal freshness and salinity are highly effective with seafood dim sum and X.O.-accented flavours.","guestprofile":"Marlborough Sauvignon Blanc drinkers, guests who enjoy herbal freshness and seafood-focused tables.","strategy":"Recommend when guests ask for crisp, aromatic white wine. Avoid with very sweet dishes or guests seeking creamy oak.","age":"Best now for freshness, though limited bottle development can bring savoury complexity.","points":["Single-vineyard Awatere Sauvignon Blanc","Villa Maria founded in 1961","Herbal and saline style","High refreshment value","Excellent with shellfish"],"bestwith":"Seafood with chives, spring onion, bell pepper, X.O. sauce and other green or herbal accents","bestdishes":["Wok-fried conch with bell pepper in X.O. sauce","Steamed garoupa dumpling with X.O. sauce","Wok-fried razor clam with chives and sliced garlic"],"flagship":{"dish":"Wok-fried conch with bell pepper in X.O. sauce","why":"Awatere herbs, lime and saline acidity lock onto bell pepper and X.O. aromatics, then refresh the chewy conch. Softer whites cannot match the sauce’s green intensity as precisely."},"whywins":"Its distinctive herbal and saline profile makes it the list’s specialist for assertive green aromatics and savoury seafood."},{"group":"White","vintage":"2023","name":"Robert Weil Kiedricher Grafenberg Riesling GG","region":"Rheingau, Germany","grape":"100% Riesling","style":"Dry Grosses Gewachs","why":"A powerful dry Riesling from one of the Rheingau's most important vineyards, combining concentration with precision.","appearance":"Pale to medium lemon.","aromas":"Peach, citrus, herbs, spice and flint.","palate":"Dry, highly concentrated and energetic, with marked acidity and a long mineral finish.","guest":"A world-class dry Riesling with peach, citrus, spice and a stony finish.","story":"Founded in Kiedrich in 1875, Robert Weil became an international reference for German Riesling. Kiedricher Grafenberg, the Hill of the Counts, is the estate’s flagship vineyard and one of the Rheingau’s celebrated sites.","matters":"It demonstrates that dry Riesling belongs among the world's great white wines, not merely within the category of aromatic wine.","list":"Its acidity, concentration and lack of tannin make it exceptionally adaptable to Cantonese seafood and savoury sauces.","guestprofile":"Experienced wine drinkers, Riesling enthusiasts, Burgundy drinkers and guests seeking a distinctive fine white.","strategy":"Lead with 'one of Germany's top dry white wines,' not sweetness. Serve around 10 to 12 C in a white-wine glass.","age":"Can develop for a decade or more, gaining wax, smoke, dried citrus and petrol-like complexity.","points":["Historic Grafenberg vineyard","Dry GG classification","Benchmark Rheingau producer","Long ageing potential","Outstanding Cantonese-food compatibility"],"bestwith":"Refined seafood with concentrated broth, tomato, Jinhua ham, dried seafood or layered umami","bestdishes":["Pan-fried lobster with tomato, served with lobster broth","Steamed garoupa fillet with bird’s nest and Jinhua ham","Steamed garoupa dumpling with X.O. sauce"],"flagship":{"dish":"Pan-fried lobster with tomato, served with lobster broth","why":"Riesling acidity handles tomato and broth simultaneously, while peach and extract match lobster sweetness. Most Chardonnay either softens the tomato too much or adds more weight than the dish needs."},"whywins":"Grafenberg combines power without tannin, making it unusually effective with complex seafood sauces that need both concentration and precision."},{"group":"White","vintage":"2022","name":"Domaine Paul Pernot Puligny-Montrachet","region":"Burgundy, France","grape":"100% Chardonnay","style":"Village white Burgundy","why":"A restrained, classical Puligny focused on white fruit, texture and chalky precision rather than overt oak.","appearance":"Pale to medium lemon-gold.","aromas":"White peach, flowers, citrus, chalk and light toast.","palate":"Textured and precise, with refined acidity and a mineral finish.","guest":"Elegant white Burgundy with peach, citrus, subtle toast and chalky freshness.","story":"The Pernot family has deep holdings in Puligny-Montrachet. The domaine is known for traditional, unflashy Chardonnay with restrained new oak.","matters":"Puligny-Montrachet is one of the reference points for fine Chardonnay and gives the list a globally recognised white Burgundy style.","list":"Its combination of texture, acidity and subtle oak suits richer seafood and premium dim sum without becoming heavy.","guestprofile":"White Burgundy drinkers, Chardonnay lovers and guests wanting a prestigious dry white with restrained oak.","strategy":"Recommend with rich shellfish and fried crab preparations. Do not sell it primarily as buttery Chardonnay; emphasise precision and minerality.","age":"Drinking well now with potential for further nutty, honeyed and savoury development; storage provenance is important.","points":["Puligny-Montrachet pedigree","100% Chardonnay","Restrained oak","Elegant mineral style","Prestigious seafood pairing"],"bestwith":"Luxury shellfish, pan-fried scallop, crab and seafood dishes where creamy texture meets mineral freshness","bestdishes":["Deep-fried crab shell stuffed with crab meat and onion","Pan-fried scallop with salmon roe, white asparagus and minced garoupa","Steamed fish maw stuffed with conch in lobster sauce"],"flagship":{"dish":"Deep-fried crab shell stuffed with crab meat and onion","why":"Puligny texture mirrors the rich crab filling, subtle oak meets frying, and chalky acidity keeps the shell crisp in perception. Lean aromatic whites lack the same textural integration."},"whywins":"This Chardonnay wins when the dish needs both luxurious mouthfeel and a mineral finish."},{"group":"Rose","vintage":"2023","name":"Grace Wine Rose","region":"Yamanashi, Japan","grape":"Cabernet Sauvignon, Merlot, Cabernet Franc and Petit Verdot","style":"Structured dry rose","why":"A serious high-altitude Japanese rose combining red fruit, herbal detail and refreshing acidity.","appearance":"Bright salmon pink.","aromas":"Blood orange, redcurrant, cherry, thyme and rosemary.","palate":"Dry, concentrated and spicy, with fresh acidity and a long finish.","guest":"A serious dry rose with red fruit, herbs, spice and freshness.","story":"Ayana Misawa created Grace Rose in 2008 to prove that Japan could produce a dry rose with genuine structure and sense of place.","matters":"It carries the Japanese fine-wine story into a versatile category often treated too casually.","list":"It gives the restaurant an Asian rose with enough structure for pork and savoury dim sum while remaining fresh with seafood.","guestprofile":"Dry rose drinkers, Japanese-wine explorers and guests wanting one wine across varied dim sum.","strategy":"Describe it as structured and dry. Serve around 10 to 12 C. Avoid framing it as simple patio wine.","age":"Best for freshness, but its structure allows short-term development toward dried fruit and spice.","points":["High-altitude Yamanashi origin","Created by Ayana Misawa","Dry structured style","Asian fine-wine story","Versatile with dim sum"],"bestwith":"Soy-marinated poultry, roast goose, savoury dim sum and mixed menus crossing seafood and light meat","bestdishes":["Marinated chicken in soy sauce","Roasted goose with plum sauce","Pan-fried minced Wagyu beef cake with water chestnut"],"flagship":{"dish":"Marinated chicken in soy sauce","why":"Redcurrant and cherry complement the sweet soy marinade, while herbal notes echo the seasoning and acidity refreshes the chicken skin. White wine can seem narrow; red wine can bring too much tannin."},"whywins":"Grace Rose succeeds as a bridge wine, combining red-fruit flavour with the freshness needed for Cantonese seasoning."},{"group":"Red","vintage":"2016","name":"Bodega Otazu Reserva Clasico","region":"Navarra, Spain","grape":"Tempranillo-led red blend","style":"Mature oak-aged Spanish red","why":"A mature Navarra red offering dark fruit, cedar, vanilla and savoury development at an approachable point in the red selection.","appearance":"Deep ruby moving toward garnet.","aromas":"Black cherry, plum, cedar, vanilla and warm spice.","palate":"Dry and medium-to-full-bodied, with mature tannin and a savoury finish.","guest":"A mature Spanish red with dark fruit, cedar and warm spice.","story":"Bodega Otazu combines an estate near Pamplona with wine, architecture and contemporary art, creating a distinctive Navarra identity.","matters":"Reserva ageing gives staff a ready-to-drink mature red without requiring the price or patience of older Bordeaux.","list":"It offers familiar Spanish warmth and oak character for guests ordering pork, beef and roasted flavours.","guestprofile":"Rioja and Spanish-wine drinkers, guests who enjoy mature oak and those seeking value in a premium red.","strategy":"Serve around 16 to 18 C and check for sediment. Recommend with pork and beef; avoid for guests requesting light, fruit-only reds.","age":"Mature and ready; further ageing should be conservative and bottle-condition dependent.","points":["Navarra Reserva","Mature drinking window","Dark fruit and cedar","Approachable premium red","Strong roasted-meat compatibility"],"bestwith":"Traditional braised beef, roast goose and savoury sauces with mature spice and gentle sweetness","bestdishes":["Stewed beef brisket and turnip in Chu Hou sauce","Roasted goose with plum sauce","Pan-fried minced Wagyu beef cake with water chestnut"],"flagship":{"dish":"Stewed beef brisket and turnip in Chu Hou sauce","why":"Mature cedar, vanilla and dark fruit echo the warm spices and depth of Chu Hou sauce, while softened tannins suit slow-cooked beef. Younger Cabernet would be firmer and less integrated."},"whywins":"Otazu wins with braised flavours because bottle development already resembles the dish’s savoury spice profile."},{"group":"Red","vintage":"2022","name":"Domaine Rewa Pinot Noir","region":"Central Otago, New Zealand","grape":"100% Pinot Noir","style":"Cool-climate medium-bodied red","why":"A silky Central Otago Pinot Noir combining ripe red fruit with freshness and fine tannin.","appearance":"Bright ruby.","aromas":"Cherry, raspberry, plum, herbs and gentle spice.","palate":"Silky and fresh, with fine tannin and medium body.","guest":"Silky Pinot Noir with ripe cherry, raspberry and gentle spice.","story":"Domaine Rewa is a small Central Otago estate with a biodynamic identity and a focus on expressive Pinot Noir from the Pisa Range area.","matters":"It offers the fragrance and delicacy of Pinot Noir in a generous, approachable New World form.","list":"Its moderate tannin and bright fruit work well with duck, mushroom and abalone-based dishes where Cabernet would be too firm.","guestprofile":"Pinot Noir and Burgundy drinkers, guests preferring lighter reds and tables ordering duck or mushroom dishes.","strategy":"Serve lightly cool at about 15 to 16 C. A short decant can open aromas, but avoid long aeration.","age":"Best across the medium term, developing dried cherry, forest-floor and savoury notes.","points":["Central Otago Pinot Noir","Small biodynamic-focused estate","Silky fine tannin","Fragrant red fruit","Excellent with duck and mushrooms"],"bestwith":"Duck, pigeon, mushroom and delicate meats that need fragrance and fine tannin rather than power","bestdishes":["Braised French duck leg in spicy and sour sauce served with sautéed conch","Stewed pigeon breast and bone with grilled slices Jinhua ham and brown fungus","Steamed rice roll with mushroom and crispy rice"],"flagship":{"dish":"Braised French duck leg in spicy and sour sauce served with sautéed conch","why":"Ripe cherry cushions sour-spicy sauce, fine tannin respects the duck, and freshness prevents the confit-like richness from building. Cabernet would be too rigid and Syrah too warm."},"whywins":"Rewa wins where red wine is required but the dish still needs lift, fragrance and moderate structure."},{"group":"Red","vintage":"2020","name":"Castello Banfi Brunello di Montalcino","region":"Tuscany, Italy","grape":"100% Sangiovese Grosso","style":"Brunello di Montalcino DOCG","why":"A powerful but polished Brunello combining ripe cherry, tobacco, acidity and long tannic structure.","appearance":"Deep ruby with garnet development.","aromas":"Plum, ripe cherry, red fruit, liquorice and pipe tobacco.","palate":"Powerful and enveloping, with lively acidity, polished tannin and persistence.","guest":"Rich Brunello with ripe cherry, plum, tobacco and a long structured finish.","story":"Castello Banfi became one of the most internationally recognisable names in Montalcino, combining research and technical innovation with the traditions of Brunello di Montalcino.","matters":"Brunello is one of Italy's benchmark fine-wine categories, and Banfi offers a consistent, recognisable expression.","list":"It provides Italian prestige with the acidity needed for rich Cantonese meat dishes and savoury sauces.","guestprofile":"Italian-wine lovers, Sangiovese drinkers, Cabernet drinkers exploring Italy and guests ordering Wagyu or roasted meats.","strategy":"Serve around 17 C and consider decanting. Lead with Brunello prestige and food-friendly acidity, not sheer power.","age":"Capable of extended development toward dried cherry, leather, tobacco and forest-floor complexity.","points":["Brunello di Montalcino DOCG","100% Sangiovese Grosso","Internationally recognised producer","Food-friendly acidity","Strong ageing potential"],"bestwith":"Rich meat with substantial fat, savoury mushrooms and slow-cooked pork or beef","bestdishes":["Wok-fried Wagyu beef with termite mushrooms","Braised pork belly with supreme sauce","Pan-fried minced Wagyu beef cake with water chestnut"],"flagship":{"dish":"Wok-fried Wagyu beef with termite mushrooms","why":"Wagyu fat softens Brunello tannin, Sangiovese acidity keeps the palate alert, and tobacco-cherry notes connect with browning and mushrooms. Softer reds lack its cleansing drive."},"whywins":"Brunello wins through the rare combination of serious structure and high acidity, ideal for fatty meat without heaviness."},{"group":"Red","vintage":"2022","name":"Beyond Time Monopole Syrah","region":"Helan Mountain East, Ningxia, China","grape":"100% Syrah","style":"Full-bodied dry red","why":"A concentrated Ningxia Syrah showing ripe blue-black fruit, spice and modern Chinese red-wine ambition.","appearance":"Deep ruby-purple.","aromas":"Blackberry, blueberry, dark plum, vanilla and spice.","palate":"Full-bodied, ripe and long, with warming alcohol and firm structure.","guest":"Rich Chinese Syrah with ripe blackberry, blueberry, vanilla and spice.","story":"Beyond Time presents a modern, concentrated expression of Syrah from the eastern foothills of Helan Mountain.","matters":"It demonstrates Ningxia's ability to produce bold international varieties with a clear luxury positioning.","list":"It gives the programme a powerful Chinese red for Wagyu, roasted pork and guests who prefer ripe, full-bodied wine.","guestprofile":"Shiraz and Syrah drinkers, guests exploring premium Chinese reds and tables ordering rich meat dishes.","strategy":"Serve around 16 to 18 C and consider a short decant. Avoid with delicate seafood and high chilli, which can amplify alcohol.","age":"Likely suited to medium-term development as fruit, oak and tannin integrate.","points":["100% Ningxia Syrah","Bold modern Chinese style","Ripe blue-black fruit","Strong with Wagyu","Important Chinese fine-wine story"],"bestwith":"Peppery beef, lamb, X.O. sauce and bold savoury dishes with char or warming spice","bestdishes":["Pan-fried beef fillet with leeks in black pepper sauce","Wok-fried lamb loin cube with potatoes in X.O. sauce","Pan-fried minced Wagyu beef cake with water chestnut"],"flagship":{"dish":"Pan-fried beef fillet with leeks in black pepper sauce","why":"Syrah’s black fruit and pepper echo the sauce directly, while full body matches seared beef. Pinot is too light and mature Tempranillo less precise with the black-pepper note."},"whywins":"This is the list’s specialist for bold pepper, char and dark-meat intensity."},{"group":"Red","vintage":"2021","name":"Ridge Vineyards Geyserville","region":"Alexander Valley, Sonoma County, USA","grape":"Zinfandel-led field blend","style":"Old-vine Californian red blend","why":"A historic site wine combining old-vine Zinfandel richness with Carignane freshness and field-blend complexity.","appearance":"Deep ruby-purple.","aromas":"Blackberry, plum, ripe cherry, cedar and spice.","palate":"Rich but fresh and layered, with elegant tannin and a long finish.","guest":"Layered old-vine Californian red with blackberry, plum, cherry and cedar.","story":"Geyserville has been produced since 1966 and is Ridge’s longest continuous Zinfandel production. Ridge Monte Bello 1971 appeared in the 1976 Judgment of Paris, the tasting that helped overturn assumptions that fine wine came only from Europe; Monte Bello later won the 2006 thirty-year re-enactment.","matters":"It is one of California's benchmark Zinfandel-based wines and proves the variety can deliver longevity and site expression.","list":"It offers generous fruit for roast pork and duck while retaining enough acidity and complexity for serious wine drinkers.","guestprofile":"California-wine drinkers, Zinfandel enthusiasts and guests wanting a rich red with more freshness than expected.","strategy":"Serve around 16 C and decant briefly if young. Explain that it is a field blend, not simple varietal Zinfandel.","age":"Can develop well beyond ten years, gaining savoury spice while retaining dark fruit.","points":["Ridge Monte Bello featured in the 1976 Judgment of Paris","Old-vine field blend","Zinfandel-led","Native-fermentation philosophy","Long ageing potential"],"bestwith":"Caramelised barbecue, honeyed pork, suckling pig and dishes with smoke, sweetness and crisp fat","bestdishes":["Barbecued Iberian pork with honey (24 hours advance notice required)","Roasted crispy suckling pig served with Chinese puff","Baked barbecued pork bun with almond flakes"],"flagship":{"dish":"Barbecued Iberian pork with honey (24 hours advance notice required)","why":"Old-vine Zinfandel fruit mirrors the honeyed caramelisation, while Carignane freshness and field-blend spice lift the pork fat. Bordeaux is drier and firmer; Pinot lacks the same fruit generosity."},"whywins":"Geyserville wins whenever roast pork needs both exuberant fruit and enough acidity to avoid a sweet, heavy finish."},{"group":"Red","vintage":"2020","name":"Bouchard Pere et Fils Nuits-Saint-Georges 1er Cru Les Cailles","region":"Burgundy, France","grape":"100% Pinot Noir","style":"Premier Cru red Burgundy","why":"A structured Nuits-Saint-Georges Premier Cru balancing red fruit, earth, spice and firm mineral shape.","appearance":"Medium ruby with garnet hints.","aromas":"Cherry, raspberry, violet, earth and spice.","palate":"Firm and fresh, with layered fruit and persistent fine tannin.","guest":"Structured red Burgundy with cherry, earth, flowers and spice.","story":"Bouchard Pere et Fils is one of Burgundy's historic houses. Les Cailles is a respected Nuits-Saint-Georges Premier Cru known for combining firmness with finesse.","matters":"It brings recognised Burgundy terroir and a more structured expression of Pinot Noir into the programme.","list":"Its earthy perfume and moderate body are excellent with duck, mushrooms and abalone, giving a premium alternative to heavier reds.","guestprofile":"Burgundy collectors, Pinot Noir drinkers and guests seeking elegance with savoury depth.","strategy":"Serve around 16 C in a Burgundy glass. Decant cautiously, mainly for sediment or initial reduction.","age":"Can develop tertiary notes of dried flowers, forest floor and game over the medium to long term.","points":["Nuits-Saint-Georges Premier Cru","Historic Burgundy house","Structured Pinot Noir","Earthy and floral","Premium duck and mushroom pairing"],"bestwith":"Mushroom, abalone, pigeon and earthy savoury dishes requiring elegant but structured Pinot Noir","bestdishes":["Braised South African Yoshihama abalone (26 head) with shiitake mushroom in supreme sauce","Stewed pigeon breast and bone with grilled slices Jinhua ham and brown fungus","Braised bamboo fungus with spinach and black truffle"],"flagship":{"dish":"Braised South African Yoshihama abalone (26 head) with shiitake mushroom in supreme sauce","why":"Earth, dried flowers and red fruit echo shiitake and supreme sauce, while fine tannin respects the abalone’s texture. A fuller red would dominate; a white would miss the earthy resonance."},"whywins":"Les Cailles wins through savoury echo: Burgundy’s earth and perfume make fungi and braised umami taste more detailed."},{"group":"Red","vintage":"2019","name":"Chateau Clerc-Milon","region":"Pauillac, Bordeaux, France","grape":"Cabernet Sauvignon-led Bordeaux blend","style":"Pauillac Fifth Growth","why":"A classified-growth Pauillac combining dark fruit, graphite, cedar and polished Cabernet structure.","appearance":"Deep ruby with youthful concentration.","aromas":"Cassis, plum, graphite, cedar, liquorice and pepper.","palate":"Dense, precise and balanced, with fine tannin and a long finish.","guest":"Classic Pauillac with blackcurrant, cedar, graphite and polished tannin.","story":"Classified as a Fifth Growth in 1855, Chateau Clerc-Milon was acquired by Baron Philippe de Rothschild in 1970 and subsequently revitalised, giving the wine an immediate Rothschild and Pauillac story.","matters":"It delivers authentic classified-growth Pauillac character and Rothschild prestige at a level that remains usable by the glass.","list":"It is the programme's key Cabernet-led fine red for business entertaining, Bordeaux enthusiasts and richer meat dishes.","guestprofile":"Bordeaux drinkers, Cabernet Sauvignon lovers, collectors and business-entertaining tables.","strategy":"Serve around 17 C and decant young bottles. Recommend with Wagyu and roasted meats; avoid with delicate dim sum.","age":"Built for long development, moving toward cedar, tobacco, leather and savoury complexity.","points":["Pauillac Fifth Growth","Rothschild ownership","Cabernet-led structure","Classified Bordeaux prestige","Excellent with Wagyu"],"bestwith":"Luxury beef, black-pepper sauces and concentrated meat dishes with enough protein for Pauillac tannin","bestdishes":["Pan-fried beef fillet with leeks in black pepper sauce","Wok-fried Wagyu beef with termite mushrooms","Pan-fried minced Wagyu beef cake with water chestnut"],"flagship":{"dish":"Pan-fried beef fillet with leeks in black pepper sauce","why":"Cabernet cassis, graphite and cedar meet seared beef and black pepper, while protein polishes the tannin. Lighter reds cannot carry the sauce; riper Syrah is less classically aligned."},"whywins":"Clerc-Milon wins when the dish has the protein, char and savoury concentration needed to unlock classified-growth Pauillac."},{"group":"Dessert","vintage":"2024","name":"La Spinetta Moscato d'Asti","region":"Piedmont, Italy","grape":"100% Moscato Bianco","style":"Lightly sparkling sweet wine","why":"A low-alcohol, highly aromatic sweet wine balancing peachy perfume, gentle bubbles and refreshing acidity.","appearance":"Pale straw with a delicate sparkle.","aromas":"Peach, apricot, lime, jasmine, honeysuckle and sage.","palate":"Sweet, gently sparkling and intensely aromatic, with a clean fresh finish.","guest":"Lightly sparkling and sweet, with peach, apricot, citrus and flowers.","story":"La Spinetta began with Moscato in 1977 and helped demonstrate that Moscato d'Asti could be treated as a serious, site-aware wine.","matters":"It is one of the easiest premium sweet wines to enjoy because low alcohol, perfume and bubbles keep sweetness lively.","list":"It pairs naturally with fruit-based and floral desserts and provides an approachable finish to a long Cantonese meal.","guestprofile":"Guests who enjoy aromatic sweetness, low alcohol and fruit-based desserts.","strategy":"Serve well chilled at 8 to 10 C. Recommend with mango, rose and light pastries; avoid very bitter chocolate.","age":"Best consumed young to preserve primary fruit and floral perfume.","points":["100% Moscato Bianco","Low alcohol","Gentle natural sparkle","Peach and floral perfume","Excellent with fruit desserts"],"bestwith":"Fresh fruit, mango, floral desserts and lightly sweet preparations that benefit from low alcohol and bubbles","bestdishes":["Chilled mango cream with sago and pomelo","Double-boiled milk pudding with peach gum and honey rose","Baked puff with hawthorn paste"],"flagship":{"dish":"Chilled mango cream with sago and pomelo","why":"Peach and apricot amplify mango, citrus freshness meets pomelo, and gentle bubbles keep sago and cream lively. Heavier sweet wines would overwhelm the fruit."},"whywins":"Moscato wins with fresh and floral desserts because it matches aroma and sweetness without adding weight or alcohol."},{"group":"Dessert","vintage":"2020","name":"Prince de Saint-Aubin Sauternes","region":"Sauternes, Bordeaux, France","grape":"Semillon","style":"Botrytised sweet white","why":"A classical Sauternes-style wine offering apricot, honey, citrus peel and botrytis complexity.","appearance":"Medium gold.","aromas":"Apricot, peach, honey, citrus peel, saffron and spice.","palate":"Sweet and viscous but refreshed by acidity, with a long honeyed finish.","guest":"Rich sweet Bordeaux with apricot, honey, citrus peel and spice.","story":"Sauternes is shaped by noble rot, which concentrates grapes and creates its signature honeyed, saffron-like complexity.","matters":"It represents one of the world's classic great sweet-wine styles and offers more depth and longevity than simple dessert wine.","list":"Its honeyed richness suits creamy and fruit-based desserts while acidity keeps the finish composed.","guestprofile":"Sweet-wine enthusiasts, classic Bordeaux drinkers and guests ordering richer desserts.","strategy":"Serve cool at about 10 C in a modest pour. Ensure the dessert is not sweeter than the wine.","age":"Can develop marmalade, caramel, saffron and nut tones over many years if well stored.","points":["Classic Sauternes style","Semillon-led richness","Noble-rot complexity","Long ageing potential","Strong with creamy desserts"],"bestwith":"Custard, creamy pudding, baked pastry and honeyed desserts with enough richness for botrytised wine","bestdishes":["Double-boiled milk pudding with peach gum and honey rose","Baked egg custard tart","Pan-fried pancake with red bean paste"],"flagship":{"dish":"Double-boiled milk pudding with peach gum and honey rose","why":"Honey, apricot and saffron integrate with the creamy pudding and rose, while acidity prevents a cloying finish. Moscato is lighter but cannot provide the same luxurious depth."},"whywins":"Sauternes wins when the dessert is creamy or pastry-based and can absorb its viscosity and noble-rot complexity."},{"group":"Dessert","vintage":"2016","name":"Puchang Colvine Sweet Muscat","region":"Xinjiang, China","grape":"Muscat","style":"Mature aromatic sweet wine","why":"A distinctive Chinese sweet Muscat combining floral perfume, apricot, grape and mature dried-fruit character.","appearance":"Deep gold.","aromas":"Orange blossom, grape, apricot, raisin and warm spice.","palate":"Sweet, rich and aromatic, with mature dried-fruit tones.","guest":"Aromatic Chinese dessert wine with flowers, apricot, grape and dried fruit.","story":"Puchang works in Xinjiang's Turpan area, using the region's intense heat and long viticultural history to create distinctive Chinese wines.","matters":"It adds a mature Chinese sweet-wine story and demonstrates Muscat's capacity for perfume and richness.","list":"It supports the list's Asian identity and pairs naturally with floral, nutty and baked Chinese desserts.","guestprofile":"Guests exploring Chinese wine, Muscat lovers and diners choosing traditional Chinese desserts.","strategy":"Serve cool in a small white-wine glass. Monitor the bottle after opening because mature aromatic wines can oxidise quickly.","age":"Already mature; enjoy for its developed dried-fruit and spice character rather than holding indefinitely.","points":["Xinjiang origin","Aromatic Muscat","Mature 2016 vintage","Chinese sweet-wine identity","Good with baked and floral desserts"],"bestwith":"Traditional Chinese sweet soups, lotus seed, papaya, snow fungus and floral or dried-fruit desserts","bestdishes":["Sweetened red lotus seed cream with fresh lotus seeds","Double-boiled papaya and snow fungus with red date","Glutinous rice roll with green tea paste and peanuts"],"flagship":{"dish":"Sweetened red lotus seed cream with fresh lotus seeds","why":"Orange blossom, grape and mature apricot sit naturally beside lotus seed’s gentle earthiness, while the Chinese origin gives the pairing cultural coherence. Sauternes is richer and less floral."},"whywins":"Puchang wins with traditional Chinese desserts where perfume, dried fruit and moderate sweetness matter more than pastry richness."}];let current=1;const nav=document.getElementById('nav'),main=document.getElementById('main'),q=document.getElementById('q');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function navRender(){let query=q.value.toLowerCase();nav.innerHTML='';[...new Set(wines.map(x=>x.group))].forEach(g=>{let arr=wines.map((x,i)=>[x,i]).filter(([x])=>x.group===g&&x.name.toLowerCase().includes(query));if(!arr.length)return;nav.insertAdjacentHTML('beforeend',`<div class="group">${esc(g)} · ${arr.length}</div>`);arr.forEach(([x,i])=>nav.insertAdjacentHTML('beforeend',`<button class="nav ${i===current?'active':''}" onclick="current=${i};render();navRender()">${esc(x.vintage)} · ${esc(x.name)}</button>`))})}function box(t,c,cls=''){return `<div class="mini ${cls}"><b>${esc(t)}</b>${c}</div>`}function render(){const x=wines[current];main.innerHTML=`<section class="hero"><div class="kicker">V12.2 · Tier 1 Core Knowledge</div><h2>${esc(x.name)}</h2><div class="sub">${esc(x.vintage)}</div></section><section class="card"><div class="facts"><div class="fact"><b>Region</b>${esc(x.region)}</div><div class="fact"><b>Grape Variety</b>${esc(x.grape)}</div><div class="fact"><b>Style</b>${esc(x.style)}</div></div><h3>Why It Matters</h3><p>${esc(x.why)}</p><h3>Tasting Profile</h3><div class="taste">${box('Appearance',esc(x.appearance))}${box('Aromas',esc(x.aromas))}${box('Palate',esc(x.palate))}${box('Guest-Friendly Description',esc(x.guest))}</div></section><details><summary>Tier 2 · Tin Lung Heen Pairing Strategy</summary><div class="inside"><div class="progrid">${box('Best With',esc(x.bestwith),'wide')}<div class="mini wide"><b>Recommended Dishes</b><ul class="points">${x.bestdishes.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div><div class="mini wide"><b>Flagship Pairing</b><div class="pairname">★ ${esc(x.flagship.dish)}</div><p>${esc(x.flagship.why)}</p></div>${box('Why It Wins',esc(x.whywins),'wide')}</div></div></details><details><summary>Tier 3 · Professional Knowledge</summary><div class="inside"><div class="progrid">${box('Producer Story',esc(x.story),'wide')}${box('Why This Wine Matters',esc(x.matters))}${box('Why It Is On The Tin Lung Heen List',esc(x.list))}${box('Guest Profile',esc(x.guestprofile))}${box('Service Strategy',esc(x.strategy))}${box('Ageing Potential',esc(x.age))}<div class="mini"><b>Key Selling Points</b><ul class="points">${x.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></div></div></details>`;window.scrollTo({top:0,behavior:'smooth'})}q.oninput=navRender;navRender();render();</script></body></html>
